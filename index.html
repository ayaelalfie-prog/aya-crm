<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aya CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#182230;--muted:#718096;--primary:#6c63ff;--danger:#e55353;--ok:#1ca56f;--border:#e7ebf2}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(430px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 12px 40px #1d2a4a12}.logo{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:8px}.sub{color:var(--muted);margin-bottom:22px}
.field{margin:10px 0}.field label{display:block;font-size:13px;margin-bottom:6px;color:#536174}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:#fff;outline:none}.field textarea{min-height:90px;resize:vertical}
.primary{background:var(--primary);color:white;padding:12px 18px;border-radius:12px;font-weight:700}.secondary{background:#eef0ff;color:var(--primary);padding:10px 14px;border-radius:11px}.danger{background:#fff0f0;color:var(--danger);padding:9px 12px;border-radius:10px}.muted{color:var(--muted);font-size:13px}
.app{display:flex;min-height:100vh}.side{width:240px;background:#fff;border-left:1px solid var(--border);padding:22px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:22px;color:var(--primary);margin-bottom:28px}.nav button{display:block;width:100%;text-align:right;background:transparent;padding:13px;border-radius:11px;margin:6px 0;color:#566273}.nav button.active,.nav button:hover{background:#f0efff;color:var(--primary);font-weight:700}.logout{margin-top:25px;width:100%;background:#fff3f3;color:#d34b4b;padding:11px;border-radius:11px}
.main{flex:1;padding:28px;max-width:1300px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:25px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px}.metric{font-size:28px;font-weight:800;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.section{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px}.section h2{margin:0 0 14px;font-size:18px}.toolbar{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}.toolbar input{flex:1;min-width:200px;padding:11px;border:1px solid var(--border);border-radius:11px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;background:#eef1f6}.b-new{background:#eaf2ff;color:#3671d8}.b-followup{background:#fff3d9;color:#a46b00}.b-interested{background:#eeeaff;color:#6c52cf}.b-contracted{background:#e4f8ef;color:#18845a}.b-not{background:#ffecec;color:#c74c4c}.modal{position:fixed;inset:0;background:#17203366;display:grid;place-items:center;padding:20px;z-index:10}.modal-card{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.x{background:#f1f3f7;border-radius:50%;width:34px;height:34px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form-grid .full{grid-column:1/-1}.row-actions{display:flex;gap:7px}.empty{text-align:center;padding:25px;color:var(--muted)}
@media(max-width:850px){.app{display:block}.side{width:100%;height:auto;position:static;border-left:0;border-bottom:1px solid var(--border);padding:14px}.nav{display:flex;overflow:auto;gap:6px}.nav button{white-space:nowrap;width:auto;margin:0}.logout{display:none}.main{padding:16px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
</style></head>
<body>
<div id="auth" class="auth"><div class="auth-card"><div class="logo">Aya CRM</div><div class="sub">إدارة عملائك ومواعيد المتابعة من أي جهاز</div>
<div id="authForm"><div class="field"><label>الإيميل</label><input id="email" type="email" placeholder="name@example.com"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" placeholder="••••••••"></div><button id="loginBtn" class="primary" style="width:100%">دخول</button><button id="signupBtn" class="secondary" style="width:100%;margin-top:8px">إنشاء حساب جديد</button><p id="authMsg" class="muted"></p></div></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">Aya CRM</div><div class="nav"><button data-page="dashboard" class="active">🏠 الرئيسية</button><button data-page="clients">👥 العملاء</button><button data-page="followups">⏰ المتابعات</button></div><button id="logout" class="logout">تسجيل الخروج</button></aside>
<main class="main"><div class="top"><div><h1 id="pageTitle">الرئيسية</h1><div class="muted">متابعة العملاء العقاريين بسهولة</div></div><button id="addBtn" class="primary">+ إضافة عميل</button></div>
<section id="dashboard" class="page"><div class="cards"><div class="card"><div class="muted">إجمالي العملاء</div><div id="mTotal" class="metric">0</div></div><div class="card"><div class="muted">متابعات اليوم</div><div id="mToday" class="metric">0</div></div><div class="card"><div class="muted">متابعات متأخرة</div><div id="mLate" class="metric">0</div></div><div class="card"><div class="muted">عملاء مهتمون</div><div id="mInterested" class="metric">0</div></div></div>
<div class="grid"><div class="section"><h2>أقرب المتابعات</h2><div id="dashFollowups"></div></div><div class="section"><h2>آخر العملاء</h2><div id="dashClients"></div></div></div></section>
<section id="clients" class="page hidden"><div class="section"><div class="toolbar"><input id="search" placeholder="ابحث بالاسم أو الرقم أو المشروع"><button class="secondary" id="addBtn2">+ عميل جديد</button></div><div class="table-wrap"><table class="table"><thead><tr><th>العميل</th><th>الهاتف</th><th>المشروع</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="clientsBody"></tbody></table></div></div></section>
<section id="followups" class="page hidden"><div class="section"><div class="toolbar"><select id="filterFollow"><option value="all">كل المتابعات</option><option value="open">غير مكتملة</option><option value="done">مكتملة</option></select></div><div id="followupsList"></div></div></section>
</main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">إضافة عميل</h2><button class="x" onclick="closeModal()">×</button></div>
<form id="clientForm"><input type="hidden" id="clientId"><div class="form-grid"><div class="field"><label>اسم العميل *</label><input id="cName" required></div><div class="field"><label>رقم الهاتف</label><input id="cPhone"></div><div class="field"><label>المشروع</label><input id="cProject" placeholder="مثال: النرجس الجديدة"></div><div class="field"><label>الميزانية</label><input id="cBudget" type="number"></div><div class="field"><label>الحالة</label><select id="cStatus"><option value="new">جديد</option><option value="followup">متابعة</option><option value="interested">مهتم</option><option value="contracted">تم التعاقد</option><option value="not_interested">غير مهتم</option></select></div><div class="field"><label>موعد المتابعة</label><input id="fDate" type="datetime-local"></div><div class="field full"><label>ملاحظات</label><textarea id="cNotes"></textarea></div><div class="field full"><label>ملاحظة المتابعة</label><input id="fNote" placeholder="مثال: الاتصال لإرسال الأسعار"></div></div><button class="primary" type="submit" style="width:100%">حفظ</button></form></div></div>
<script>
const SUPABASE_URL="https://flnbcyhgmhvoctibhdqz.supabase.co";
const SUPABASE_KEY="sb_publishable_4oUbQU3Lq7RfGdRADTjXhQ_Cj61_FRr";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null, clients=[], followups=[];
const $=id=>document.getElementById(id);
const statusText={new:"جديد",followup:"متابعة",interested:"مهتم",contracted:"تم التعاقد",not_interested:"غير مهتم"};
function badge(s){return '<span class="badge b-'+s+'">'+statusText[s]+'</span>'}
function fmt(d){return new Date(d).toLocaleString("ar-EG",{dateStyle:"medium",timeStyle:"short"})}
async function load(){
 const [c,f]=await Promise.all([sb.from("clients").select("*").order("created_at",{ascending:false}),sb.from("followups").select("*,clients(name,phone)").order("followup_at",{ascending:true})]);
 clients=c.data||[]; followups=f.data||[]; render();
}
function render(){
 const now=new Date(), start=new Date(); start.setHours(0,0,0,0); const end=new Date(start); end.setDate(end.getDate()+1);
 $("mTotal").textContent=clients.length; $("mToday").textContent=followups.filter(x=>!x.completed&&new Date(x.followup_at)>=start&&new Date(x.followup_at)<end).length;
 $("mLate").textContent=followups.filter(x=>!x.completed&&new Date(x.followup_at)<now).length;
 $("mInterested").textContent=clients.filter(x=>x.status==="interested").length;
 $("dashClients").innerHTML=clients.slice(0,6).map(c=>'<div style="padding:10px 0;border-bottom:1px solid #eee"><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.project||"—")+' · '+badge(c.status)+'</div></div>').join("")||'<div class="empty">لا يوجد عملاء بعد</div>';
 $("dashFollowups").innerHTML=followups.filter(x=>!x.completed).slice(0,6).map(f=>'<div style="padding:10px 0;border-bottom:1px solid #eee"><b>'+esc(f.clients?.name||"عميل")+'</b><div class="muted">'+fmt(f.followup_at)+(new Date(f.followup_at)<now?' · <span style="color:#d34b4b">متأخرة</span>':"")+'</div></div>').join("")||'<div class="empty">لا توجد متابعات</div>';
 const q=($("search")?.value||"").toLowerCase(); const filtered=clients.filter(c=>(c.name+" "+(c.phone||"")+" "+(c.project||"")).toLowerCase().includes(q));
 $("clientsBody").innerHTML=filtered.map(c=>'<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.phone||"—")+'</td><td>'+esc(c.project||"—")+'</td><td>'+badge(c.status)+'</td><td><div class="row-actions"><button class="secondary" onclick="editClient(\''+c.id+'\')">تعديل</button><button class="danger" onclick="deleteClient(\''+c.id+'\')">حذف</button></div></td></tr>').join("")||'<tr><td colspan="5"><div class="empty">لا يوجد عملاء</div></td></tr>';
 const ff=$("filterFollow")?.value||"all"; const fl=followups.filter(x=>ff==="all"||ff==="open"&&!x.completed||ff==="done"&&x.completed);
 $("followupsList").innerHTML=fl.map(f=>'<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>'+esc(f.clients?.name||"عميل")+'</b><div class="muted">'+esc(f.clients?.phone||"")+'</div></div><div class="muted">'+fmt(f.followup_at)+'</div></div><p>'+esc(f.note||"بدون ملاحظة")+'</p><button class="'+(f.completed?"secondary":"primary")+'" onclick="toggleFollow(\''+f.id+'\','+(f.completed?"false":"true")+')">'+(f.completed?"إلغاء الإكمال":"تمت المتابعة")+'</button></div>').join("")||'<div class="empty">لا توجد متابعات</div>';
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function openModal(c=null){$("modal").classList.remove("hidden");$("modalTitle").textContent=c?"تعديل العميل":"إضافة عميل";$("clientId").value=c?.id||"";$("cName").value=c?.name||"";$("cPhone").value=c?.phone||"";$("cProject").value=c?.project||"";$("cBudget").value=c?.budget||"";$("cStatus").value=c?.status||"new";$("cNotes").value=c?.notes||"";$("fDate").value="";$("fNote").value=""}
function closeModal(){$("modal").classList.add("hidden")}
window.closeModal=closeModal;
window.editClient=id=>openModal(clients.find(c=>c.id===id));
window.deleteClient=async id=>{if(!confirm("حذف العميل؟"))return;await sb.from("clients").delete().eq("id",id);await load()};
window.toggleFollow=async(id,v)=>{await sb.from("followups").update({completed:v}).eq("id",id).eq("user_id",user.id);await load()};
$("clientForm").onsubmit=async e=>{e.preventDefault();const id=$("clientId").value;const data={name:$("cName").value,phone:$("cPhone").value,project:$("cProject").value,budget:$("cBudget").value?Number($("cBudget").value):null,status:$("cStatus").value,notes:$("cNotes").value};let clientId=id;
 if(id){await sb.from("clients").update(data).eq("id",id).eq("user_id",user.id)}else{data.user_id=user.id;const r=await sb.from("clients").insert(data).select().single();clientId=r.data?.id}
 if($("fDate").value&&clientId){await sb.from("followups").insert({user_id:user.id,client_id:clientId,followup_at:new Date($("fDate").value).toISOString(),note:$("fNote").value})}
 closeModal();await load();notifySoon();
};
$("search").oninput=render;$("filterFollow").onchange=render;$("addBtn").onclick=()=>openModal();$("addBtn2").onclick=()=>openModal();
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));$(b.dataset.page).classList.remove("hidden");$("pageTitle").textContent=b.textContent.replace(/^[^ ]+ /,"")});
$("loginBtn").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)$("authMsg").textContent=error.message};
$("signupBtn").onclick=async()=>{const {error}=await sb.auth.signUp({email:$("email").value,password:$("password").value});$("authMsg").textContent=error?error.message:"تم إنشاء الحساب. لو طلب منك تأكيد الإيميل، أكديه ثم سجّلي الدخول."};
$("logout").onclick=()=>sb.auth.signOut();
async function start(s){user=s?.user||null;if(user){$("auth").classList.add("hidden");$("app").classList.remove("hidden");await load();notifySoon()}else{$("auth").classList.remove("hidden");$("app").classList.add("hidden")}}
function notifySoon(){if(!("Notification"in window)||Notification.permission==="granted")return;Notification.requestPermission().catch(()=>{})}
sb.auth.onAuthStateChange((_e,s)=>start(s));sb.auth.getSession().then(({data})=>start(data.session));
</script></body></html>
